name: Android Test APK

on:
  push:
    branches: [main, 'fridgey-together/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Verify preinstalled Android SDK 36
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          test -f "$sdk/platforms/android-36/android.jar"
          test -d "$sdk/build-tools/36.0.0"
      - name: Restore Firebase configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "::error::FIREBASE_CONFIG repository secret is missing"
            exit 1
          fi
          printf '%s' "$FIREBASE_CONFIG" > app/google-services.json
          python3 -c 'import json; d=json.load(open("app/google-services.json")); assert any(c["client_info"]["android_client_info"]["package_name"] == "com.fridgeytogether.app" for c in d["client"]), "Firebase Android package does not match"'
      - name: Build test APK
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: fridgey-together-test-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
